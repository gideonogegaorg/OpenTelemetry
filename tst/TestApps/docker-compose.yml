# Local OTLP collector for validating the TestApps end-to-end (traces, metrics, logs), plus SQL Server
# and PostgreSQL for the DB scenarios (the "db" profile; host ports 14333 / 54333 so they never collide
# with a local server on 1433 / 5432).
#
#   docker compose -f tst/TestApps/docker-compose.yml up -d
#   docker compose -f tst/TestApps/docker-compose.yml --profile db up -d --wait   # with the databases
#   # point each TestApp's appsettings.json at http://localhost:4317 (gRPC, modern)
#   # or http://localhost:4318 (HTTP/protobuf, net48), run the apps, then inspect:
#   #   tst/TestApps/otel-out/otel.json      (every exported span / metric / log)
#   docker compose -f tst/TestApps/docker-compose.yml --profile db down
#
# Pinned for reproducibility; bump deliberately.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: gmo-otel-testapps-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - ./otel-out:/output
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP/protobuf

  # Throwaway credentials for a local container; Invoke-TestAppValidation.ps1 uses the same values.
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU10-GDR1-ubuntu-24.04
    container_name: gmo-otel-testapps-mssql
    profiles: ["db"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: GmoOtel_Test1!
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:18.6-alpine
    container_name: gmo-otel-testapps-postgres
    profiles: ["db"]
    environment:
      POSTGRES_USER: gmo
      POSTGRES_PASSWORD: GmoOtel_Test1!
      POSTGRES_DB: gmo_otel
    ports:
      - "54333:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmo -d gmo_otel"]
      interval: 2s
      timeout: 5s
      retries: 30
