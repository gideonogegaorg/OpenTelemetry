name: Build and Publish

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: gideonogegaorg/DevOps/.github/workflows/dotnet-lint.yml@main
    with:
      solution_file: src/GMO.OpenTelemetry.sln
      # This repo produces the GMO feed, so it never restores from it.
      use_gmo_feed: "false"

  build:
    runs-on: ubuntu-26.04
    needs: [lint]
    outputs:
      assembly_version: ${{ steps.setversion.outputs.assembly_version }}
      dll_version: ${{ steps.setversion.outputs.dll_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SDK 10 ships only the net10 runtime, so add 8/9 for test execution.
      - name: Setup .NET (multi-runtime)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install Mono (net48 build/test on Linux)
        run: bash .github/scripts/install-mono.sh && dotnet --list-runtimes

      - name: Set version
        id: setversion
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          DAY=$(date +%d)
          HHMM=$(date +%H%M)
          ASSEMBLY_VERSION="$YEAR.$MONTH.$DAY.$HHMM"
          if [ "$REF_NAME" = "dev" ]; then
            DLL_VERSION="DEV-$YEAR$MONTH$DAY-$HHMM"
          else
            DLL_VERSION="$YEAR$MONTH$DAY-$HHMM"
          fi
          echo "ASSEMBLY_VERSION=$ASSEMBLY_VERSION" >> "$GITHUB_ENV"
          echo "DLL_VERSION=$DLL_VERSION" >> "$GITHUB_ENV"
          echo "assembly_version=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "dll_version=$DLL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/GMO.OpenTelemetry.sln

      - name: Build
        run: |
          dotnet build src/GMO.OpenTelemetry.sln -c Release --no-restore \
            -p:Version="$ASSEMBLY_VERSION" \
            -p:AssemblyVersion="$ASSEMBLY_VERSION" \
            -p:FileVersion="$ASSEMBLY_VERSION" \
            -p:InformationalVersion="$DLL_VERSION"

  test:
    runs-on: ubuntu-26.04
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET (multi-runtime)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install Mono (net48 build/test on Linux)
        run: bash .github/scripts/install-mono.sh
      - name: Restore
        run: dotnet restore src/GMO.OpenTelemetry.sln
      - name: Build
        run: |
          dotnet build src/GMO.OpenTelemetry.sln -c Release --no-restore \
            -p:Version=${{ needs.build.outputs.assembly_version }} \
            -p:AssemblyVersion=${{ needs.build.outputs.assembly_version }} \
            -p:FileVersion=${{ needs.build.outputs.assembly_version }} \
            -p:InformationalVersion=${{ needs.build.outputs.dll_version }}
      - name: Test (per framework)
        run: |
          set -e
          TESTS=tst/GMO.OpenTelemetry.Tests/GMO.OpenTelemetry.Tests.csproj
          # net48 runs under Mono; net8/9/10 via VSTest. Per-framework keeps failures isolated.
          dotnet test $TESTS --no-build -c Release --framework net48
          dotnet test $TESTS --no-build -c Release --framework net8.0
          dotnet test $TESTS --no-build -c Release --framework net9.0
          dotnet test $TESTS --no-build -c Release --framework net10.0

  # Analysis and coverage only; the per-framework test job above is the merge gate.
  sonar:
    needs: [lint]
    permissions:
      contents: read
      pull-requests: write
    uses: gideonogegaorg/DevOps/.github/workflows/dotnet-sonarqube-scan.yml@main
    with:
      solution_file: src/GMO.OpenTelemetry.sln
      dotnet_version: |
        8.0.x
        9.0.x
        10.0.x
      pre_build_script: .github/scripts/install-mono.sh
      # Coverlet collects nothing under Mono, so coverage comes from net10.0 only.
      test_framework: net10.0
      use_gmo_feed: "false"
      postgres_enabled: "false"
      production_branch: main
      development_branch: dev
      sonar_main_branch: main
      sonar_project_key: gideonogegaorg_OpenTelemetry
      coverlet_runsettings: coverlet.runsettings
      sonar_exclusions: "**/tst/**,**/bin/**,**/obj/**,**/coverage/**,**/nupkgs/**,**/.github/**"
      sonar_coverage_exclusions: "**/tst/**"
      sonar_cpd_exclusions: "**/tst/**"
    secrets: inherit

  tag:
    if: github.event_name == 'push'
    needs: [test]
    permissions:
      contents: write
    uses: gideonogegaorg/DevOps/.github/workflows/dotnet-tag.yml@main

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-26.04
    needs: [build, tag]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET (multi-runtime)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install Mono (net48 pack on Linux)
        run: bash .github/scripts/install-mono.sh
      - name: Pack
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "dev" ]; then
            PACKAGE_VERSION="${{ needs.build.outputs.assembly_version }}-alpha"
          else
            PACKAGE_VERSION="${{ needs.build.outputs.assembly_version }}"
          fi
          # Pack only the shippable libraries (skip tests and TestApps under tst/).
          for project in src/GMO.OpenTelemetry/GMO.OpenTelemetry.csproj \
                         src/GMO.OpenTelemetry.Serilog/GMO.OpenTelemetry.Serilog.csproj \
                         src/GMO.OpenTelemetry.Log4Net/GMO.OpenTelemetry.Log4Net.csproj \
                         src/GMO.OpenTelemetry.SqlClient/GMO.OpenTelemetry.SqlClient.csproj \
                         src/GMO.OpenTelemetry.Npgsql/GMO.OpenTelemetry.Npgsql.csproj; do
            dotnet pack "$project" -c Release -o nupkgs \
              -p:PackageVersion=$PACKAGE_VERSION \
              -p:Version=${{ needs.build.outputs.assembly_version }} \
              -p:AssemblyVersion=${{ needs.build.outputs.assembly_version }} \
              -p:FileVersion=${{ needs.build.outputs.assembly_version }} \
              -p:InformationalVersion=${{ needs.build.outputs.dll_version }}
          done
      - name: Push to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GH_CLASSIC_PAT }}
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: |
          for pkg in nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE"
          done
