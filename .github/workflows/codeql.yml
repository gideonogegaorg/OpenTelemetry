name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CodeQL:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: gideonogegaorg/DevOps/.github/workflows/dotnet-codeql.yml@main
    with:
      solution_file: src/GMO.OpenTelemetry.sln
      pre_build_script: .github/scripts/install-mono.sh
      use_gmo_feed: "false"
      queries: security-extended
      # Public repo: code scanning is free, so results go to the Security tab.
      upload_results: "true"
